name: Python example (python-example-project)

on:
  push:
    branches: [ "**" ]
    paths: [ "python-example-project/**", ".github/workflows/python.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "python-example-project/**", ".github/workflows/python.yml" ]

defaults:
  run:
    working-directory: python-example-project

jobs:
  fast-tests:
    name: Unit and integration tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-example-project/requirements.txt

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests/unit

      - name: Integration tests
        run: pytest tests/integration

      - name: Coverage (unit + integration)
        run: pytest --cov --cov-report=term-missing --cov-report=html --cov-report=json

      - name: Add coverage table to the job summary
        run: python scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: python-example-project/htmlcov/

  e2e-tests:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: fast-tests   # only spend the slow minutes if the fast tests pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-example-project/requirements.txt

      - run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: End-to-end tests
        run: pytest tests/e2e --screenshot only-on-failure

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-playwright-results
          path: python-example-project/test-results/
