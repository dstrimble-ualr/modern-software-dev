apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-example
  labels:
    app: python-example
spec:
  # No `replicas:` here. hpa.yaml owns the pod count; setting it here too would
  # reset it to this number on every deploy.
  revisionHistoryLimit: 5           # how far back `kubectl rollout undo` can go
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                   # start one new pod at a time...
      maxUnavailable: 0             # ...and never drop below the current ready count
  selector:
    matchLabels:
      app: python-example
  template:
    metadata:
      labels:
        app: python-example
    spec:
      containers:
        - name: app
          image: python-example-project   # kustomization.yaml swaps in the real image
          ports:
            - name: http
              containerPort: 8000
          # Not "ready" until it serves the login page. A rolling update waits for
          # this before moving on, so a pod that can't serve never gets traffic.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # Measured: ~22 MiB idle and under load; ~90m CPU at 20 virtual users.
          # The HPA scales on CPU *as a percentage of this request*. Keep memory
          # small: the cluster is shared and short on memory.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 96Mi
