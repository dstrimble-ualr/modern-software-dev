# Scale between 2 and 5 pods to keep average CPU near 50% of the 25m request.
# Watch it during a load test: kubectl -n python-example get hpa -w
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-example
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-example
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default is 300; shorter so class sees it scale back down
