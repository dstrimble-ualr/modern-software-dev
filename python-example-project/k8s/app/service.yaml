# Cluster-internal only. For class: kubectl -n python-example port-forward svc/python-example 8000:80
apiVersion: v1
kind: Service
metadata:
  name: python-example
  labels:
    app: python-example
spec:
  type: ClusterIP
  selector:
    app: python-example
  ports:
    - name: http
      port: 80
      targetPort: http
