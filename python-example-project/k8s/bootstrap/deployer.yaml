# The identity GitHub Actions uses to deploy. It can manage the app in this one
# namespace and nothing else: no other namespaces, no cluster-wide objects.
# Apply once, as a cluster admin: kubectl apply -f k8s/bootstrap/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: python-example
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: python-example
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]          # rollout status, history, undo
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]     # the post-deploy k6 smoke test
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: python-example
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: python-example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
---
# A long-lived token for the account. scripts/deployer_kubeconfig.sh turns it into
# the KUBECONFIG secret for GitHub. Delete this Secret to revoke it.
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: python-example
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
